# English strings for Rupee's own pages. config/fork/locales/en.yml is
# generated by bin/rails fork:locales; this file is written by hand.
en:
  breadcrumbs:
    household_settings: Household
    household_ais: Rupee
  fork:
    source_notice:
      text: "%{product_name} is free software under the GNU AGPLv3."
      commit_link: Source for this version (%{commit})
      source_link: Source code
    settings_nav:
      household_label: Household
    banners:
      timezone_title: Confirm your household's time zone
      timezone_body: >-
        Bills, card credits and reminders follow your household's time zone,
        which is currently %{timezone}. Confirm it so dates land on the right day.
      timezone_unset: not set
      timezone_action: Confirm time zone
      ai_setup_title: Set up Rupee
      ai_setup_body: >-
        Rupee can categorize transactions, answer questions about your money
        and read bank statements, using an AI model you choose. Nothing is
        sent to a model until an admin agrees.
      ai_setup_action: Set up Rupee
    mcp:
      ai_off: AI features are off for this household
    imports:
      ai_off: >-
        Reading PDFs and documents uses AI, which is off for this household.
        An admin can turn it on in Settings > Household.
    household_settings:
      show:
        page_title: Household
        timezone_title: Time zone
        timezone_subtitle: >-
          Rupee uses this time zone to decide when bills are due, when card
          credits reset and when reminders go out.
        timezone_unconfirmed: >-
          No one has confirmed this household's time zone yet. Check it below
          and confirm it.
        timezone_confirmed_on: Confirmed as %{timezone} on %{date}.
        timezone_label: Household time zone
        timezone_submit: Confirm time zone
        ai_title: Rupee, the AI agent
        ai_subtitle: Choose whether Rupee may send household data to an AI model.
        ai_on: Rupee is on.
        ai_off: Rupee is off. No household data is sent to an AI model.
        ai_manage: Manage Rupee
      update:
        timezone_required: Choose a time zone to confirm.
        timezone_invalid: That time zone isn't recognized. Choose one from the list.
        timezone_confirmed: Time zone confirmed.
    household_ais:
      show:
        page_title: Rupee
        title: Rupee, the AI agent
        subtitle: >-
          Rupee uses an AI model to categorize transactions, answer questions
          and read statements. It stays off until an admin agrees to what it sends.
        on_since: Rupee is on. %{name} agreed on %{date}.
        someone: An admin
        off_notice: Rupee is off. No household data is sent to an AI model.
        sends_title: What Rupee sends to the model
        sends:
          categorize: Transaction names, amounts, dates and merchants, to categorize transactions and find merchants.
          chat: Your questions in chat, and the accounts, balances and transactions Rupee looks up to answer them.
          statements: Bank statements and documents you upload, to import their transactions.
          bills: A bill's recent charges, to suggest how to set it up.
          insights: Summaries of your spending, to write insights.
          mcp: Your household's data, to AI apps you connect through MCP.
        never_sends: Rupee never sends passwords, bank logins or bank connection tokens.
        provider_label: Model provider
        provider_help: >-
          A self-hosted model keeps your data on your own machine, at some
          cost in answer quality.
        self_hosted: Self-hosted model at %{host}
        guests_label: Let guests use Rupee
        guests_help: Guests, such as an invited adviser, can chat with Rupee about your household's data.
        consent_label: I agree to send this household's data to the chosen model provider.
        turn_on: Turn on Rupee
        turn_off: Turn off Rupee
        turn_off_confirm: Turn off Rupee? Nothing more will be sent to the model until an admin turns it on again.
        no_provider_title: No model provider is set up
        no_provider_body: >-
          Rupee needs an OpenAI, Anthropic or self-hosted model key before it
          can be turned on.
        no_provider_action: Add a model key
      update:
        consent_required: Agree to what Rupee sends before turning it on.
        provider_unavailable: That model provider isn't set up. Choose another.
        turned_on: Rupee is on.
      destroy:
        turned_off: Rupee is off.
