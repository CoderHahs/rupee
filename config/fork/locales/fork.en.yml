# English strings for Rupee's own pages. config/fork/locales/en.yml is
# generated by bin/rails fork:locales; this file is written by hand.
en:
  breadcrumbs:
    household_settings: Household
    household_ais: Rupee
  fork:
    source_notice:
      text: "%{product_name} is free software under the GNU AGPLv3."
      commit_link: Source for this version (%{commit})
      source_link: Source code
    settings_nav:
      household_label: Household
    banners:
      timezone_title: Confirm your household's time zone
      timezone_body: >-
        Bills, card credits and reminders follow your household's time zone,
        which is currently %{timezone}. Confirm it so dates land on the right day.
      timezone_unset: not set
      timezone_action: Confirm time zone
      ai_setup_title: Set up Rupee
      ai_setup_body: >-
        Rupee can categorize transactions, answer questions about your money
        and read bank statements, using an AI model you choose. Nothing is
        sent to a model until an admin agrees.
      ai_setup_action: Set up Rupee
      connection:
        details: All connections
        revoked:
          title: "%{name}: access was revoked"
          body: You removed Rupee's access at the institution. Delete the synced data, or keep it as history.
        pending_disconnect:
          title: "%{name} will disconnect soon"
          body: Reconnect before %{date} to keep syncing.
        login_required:
          title: "%{name} needs you to sign in again"
          body: Syncing is paused until you reconnect.
        consent_expiring:
          title: "%{name}: consent is expiring"
          body: Renew consent by %{date} to keep syncing.
        new_accounts:
          title: "%{name} has new accounts"
          body: The institution reports accounts Rupee can add.
        sync_error:
          title: "%{name} had a sync error"
          body: "Plaid reported %{code}."
    connections:
      not_allowed: You cannot manage that connection.
      keep:
        kept: Kept the accounts and history. Syncing stays off for that connection.
      statuses:
        healthy: Healthy
        revoked: Revoked
        pending_disconnect: Pending disconnect
        login_required: Login required
        consent_expiring: Consent expiring
        new_accounts: New accounts
        sync_error: Sync error
      actions:
        keep: Keep as history
        delete: Delete data
        delete_title: Delete this connection?
        delete_body: This deletes the connection and its synced data.
        reconnect: Reconnect
        renew: Renew consent
        add_accounts: Add accounts
        retry: Retry sync
      index:
        title: Connections
        budget: "%{used} of %{cap} Plaid Items used"
        empty: No connections yet.
        last_success: Last successful sync %{time} ago
        never_synced: Not synced yet
        consent_ends: Consent ends %{date}
        disconnect_on: Disconnects %{date}
    chooser_note:
      used: "%{used} of %{cap} Plaid Items used"
      reserved: Plaid Items are reserved for banks and cards. Use SnapTrade or Questrade for brokerage accounts.
    plaid_item_budgets:
      exhausted:
        title: Plaid Item limit reached
        used: "%{used} of %{cap} Plaid Items are used."
        explanation: Plaid caps the Items this household can create, and a deleted Item still uses its slot, so no new Plaid connection can be started.
        brokerage: Brokerage accounts can still be connected through SnapTrade or Questrade.
        connections: See all connections
    price_label:
      none: No price yet
      last_price: "Last price %{date}"
      observed: "Observed %{date} (%{provider})"
      unknown_provider: no provider
    mcp:
      ai_off: AI features are off for this household
    imports:
      ai_off: >-
        Reading PDFs and documents uses AI, which is off for this household.
        An admin can turn it on in Settings > Household.
    household_settings:
      show:
        page_title: Household
        timezone_title: Time zone
        timezone_subtitle: >-
          Rupee uses this time zone to decide when bills are due, when card
          credits reset and when reminders go out.
        timezone_unconfirmed: >-
          No one has confirmed this household's time zone yet. Check it below
          and confirm it.
        timezone_confirmed_on: Confirmed as %{timezone} on %{date}.
        timezone_label: Household time zone
        timezone_submit: Confirm time zone
        ai_title: Rupee, the AI agent
        ai_subtitle: Choose whether Rupee may send household data to an AI model.
        ai_on: Rupee is on.
        ai_off: Rupee is off. No household data is sent to an AI model.
        ai_manage: Manage Rupee
      update:
        timezone_required: Choose a time zone to confirm.
        timezone_invalid: That time zone isn't recognized. Choose one from the list.
        timezone_confirmed: Time zone confirmed.
    household_ais:
      show:
        page_title: Rupee
        title: Rupee, the AI agent
        subtitle: >-
          Rupee uses an AI model to categorize transactions, answer questions
          and read statements. It stays off until an admin agrees to what it sends.
        on_since: Rupee is on. %{name} agreed on %{date}.
        someone: An admin
        off_notice: Rupee is off. No household data is sent to an AI model.
        sends_title: What Rupee sends to the model
        sends:
          categorize: Transaction names, amounts, dates and merchants, to categorize transactions and find merchants.
          chat: Your questions in chat, and the accounts, balances and transactions Rupee looks up to answer them.
          statements: Bank statements and documents you upload, to import their transactions.
          bills: A bill's recent charges, to suggest how to set it up.
          insights: Summaries of your spending, to write insights.
          mcp: Your household's data, to AI apps you connect through MCP.
        never_sends: Rupee never sends passwords, bank logins or bank connection tokens.
        provider_label: Model provider
        provider_help: >-
          A self-hosted model keeps your data on your own machine, at some
          cost in answer quality.
        self_hosted: Self-hosted model at %{host}
        guests_label: Let guests use Rupee
        guests_help: Guests, such as an invited adviser, can chat with Rupee about your household's data.
        consent_label: I agree to send this household's data to the chosen model provider.
        turn_on: Turn on Rupee
        turn_off: Turn off Rupee
        turn_off_confirm: Turn off Rupee? Nothing more will be sent to the model until an admin turns it on again.
        no_provider_title: No model provider is set up
        no_provider_body: >-
          Rupee needs an OpenAI, Anthropic or self-hosted model key before it
          can be turned on.
        no_provider_action: Add a model key
      update:
        consent_required: Agree to what Rupee sends before turning it on.
        provider_unavailable: That model provider isn't set up. Choose another.
        turned_on: Rupee is on.
      destroy:
        turned_off: Rupee is off.
    liabilities:
      bill_name: "%{name} payment"
    liability_statements:
      index:
        page_title: "Statements for %{account}"
        title: "Statements: %{account}"
        add: Add a statement
        empty_title: No statements yet
        empty_description: Statements from your bank appear here after a sync. You can also add one by hand.
        issued: "Issued %{date}"
        due_only: "Due %{date}"
        source_plaid: From your bank
        source_manual: Entered by hand
        overdue: Overdue
        minimum_paid: Minimum paid, balance carried
        edit: Edit
        delete: Delete
        delete_confirm: Delete this statement?
        not_provided: Not provided by the institution
        fields:
          due_on: Due date
          statement_balance: Statement balance
          minimum_due: Minimum due
          last_payment_amount: Last payment
          last_payment_on: Last payment date
          aprs: APRs
        pending:
          needs_funding_account: Choose the account this bill is paid from by editing the statement.
          needs_currency: This card's bill is in another currency. Change the bill's currency to match the card.
      new:
        page_title: Add a statement
      edit:
        page_title: Edit statement
      form:
        invalid: The statement could not be saved.
        issued_on: Issue date
        due_on: Due date
        statement_balance: Statement balance
        minimum_due: Minimum due
        last_payment_amount: Last payment amount
        last_payment_on: Last payment date
        is_overdue: Past due
        funding_account: Paid from
        funding_account_default: Use the bill's account
        cancel: Cancel
        save: Save statement
      create:
        created: Statement added.
      update:
        updated: Statement updated.
      destroy:
        destroyed: Statement deleted.
