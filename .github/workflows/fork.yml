name: Fork surface

# Checks that the fork still edits upstream Sure only where
# config/fork/upstream_edits.yml says it does, that nothing it adds collides
# with upstream's main, and that db/schema.rb is upstream's schema plus the
# fork's migrations. See bin/check-fork-surface and design §4.1.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  surface:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      PLAID_CLIENT_ID: foo
      PLAID_SECRET: bar
      DATABASE_URL: postgres://postgres:postgres@localhost:5432 # pipelock:ignore
      REDIS_URL: redis://localhost:6379
      RAILS_ENV: test

    services:
      postgres:
        image: postgres
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3

      redis:
        image: redis
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libvips postgresql-client libpq-dev

      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@97ecb7b512899eb71ab1bf2310a624c6f1589ac6 # v1.308.0
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Fetch upstream main
        run: git fetch --no-tags https://github.com/we-promise/sure.git main

      - name: Check the fork surface
        run: bin/check-fork-surface --upstream FETCH_HEAD --schema
